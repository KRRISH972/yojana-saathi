<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Yojana Saathi: find Indian government schemes you are eligible for, in Hindi, Hinglish or English, by typing or speaking." />
    <meta name="theme-color" content="#047857" />
    <title>Yojana Saathi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23047857'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white'%3E%E0%A4%AF%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <div class="mx-auto flex h-dvh max-w-xl flex-col">
      <header class="flex items-center gap-2 bg-emerald-700 px-4 py-3 text-white">
        <div class="min-w-0 flex-1">
          <h1 id="title" class="text-xl font-bold">योजना साथी</h1>
          <p id="subtitle" class="truncate text-sm text-emerald-50">सरकारी योजनाएँ खोजें, आसान भाषा में</p>
        </div>
        <div class="flex overflow-hidden rounded-lg border border-emerald-200 text-sm" role="group" aria-label="Language / भाषा">
          <button id="lang-hi" type="button" class="px-3 py-2 aria-pressed:bg-white aria-pressed:text-emerald-800" aria-pressed="true">हिंदी</button>
          <button id="lang-en" type="button" class="px-3 py-2 aria-pressed:bg-white aria-pressed:text-emerald-800" aria-pressed="false">English</button>
        </div>
      </header>

      <main id="log" class="flex flex-1 flex-col gap-3 overflow-y-auto p-4" aria-live="polite" aria-label="Chat"></main>

      <p id="status" class="px-4 pb-1 text-sm text-slate-600" hidden></p>
      <div id="quick" class="flex gap-2 px-4 pb-2" hidden></div>

      <form id="composer" class="flex items-end gap-2 border-t border-slate-200 bg-white p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
        <button id="mic" type="button" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-emerald-700 text-2xl text-white" aria-label="बोलें">🎤</button>
        <label for="message" class="sr-only">Message</label>
        <textarea id="message" rows="1" maxlength="1000" enterkeyhint="send" class="max-h-32 min-h-12 flex-1 resize-none rounded-xl border border-slate-300 px-3 py-3 text-base focus:border-emerald-600 focus:outline-none" placeholder="अपना सवाल लिखें या बोलें…"></textarea>
        <button id="send" type="submit" class="h-12 shrink-0 rounded-xl bg-emerald-700 px-4 font-semibold text-white disabled:opacity-50">भेजें</button>
      </form>

      <footer class="flex items-center gap-3 bg-white px-4 pb-3 text-xs text-slate-500">
        <p id="disclaimer" class="flex-1">यह केवल जानकारी है। आवेदन से पहले आधिकारिक वेबसाइट पर जाँच लें। हम कभी आधार नंबर, बैंक खाता या OTP नहीं माँगते।</p>
        <button id="new-chat" type="button" class="shrink-0 underline">नई बातचीत</button>
      </footer>
    </div>

    <script src="/js/logic.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
